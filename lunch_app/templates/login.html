<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | 社内昼食注文システム</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/lunch.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>🍱 社内昼食注文システム</h1>
    <p class="sub">ログインID とパスワードを入力してください</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">ログインID</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary">ログイン</button>
    </form>
  </div>
</div>
</body>
</html>
