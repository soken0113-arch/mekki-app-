{% extends "base.html" %}
{% block title %}パスワード変更{% endblock %}

{% block content %}
<h1 class="page-title">パスワード変更</h1>
<p class="page-sub">8文字以上のパスワードを設定してください。</p>

{% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
{% if success %}<div class="flash flash-success">{{ success }}</div>{% endif %}

<div class="card" style="max-width:440px;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="current_password">現在のパスワード</label>
      <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new_password">新しいパスワード</label>
      <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="8" required>
    </div>
    <div class="field">
      <label for="confirm_password">新しいパスワード（確認）</label>
      <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>
    </div>
    <button type="submit" class="btn btn-primary">変更する</button>
  </form>
</div>
{% endblock %}
